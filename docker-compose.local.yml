# Lokal udvikling uden Dokploy-netværk:
# docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  web:
    ports:
      - "3000:3000"
  api:
    environment:
      Cors__SpaOrigins: http://localhost:3000;http://127.0.0.1:3000;http://localhost:5253;http://127.0.0.1:5253
    ports:
      - "8080:8080"

networks:
  default:
    name: mercantec-tech-local
    external: false
