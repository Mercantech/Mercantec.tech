<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LUP</title><link rel="stylesheet" href="style.css"></head>
<body class="popup"><main><header><h1>LUP</h1></header>
<p>Højreklik på et billede → <strong>Tilføj som emoji på LUP.dk</strong>. Beskær, zoom og gem direkte herfra.</p>
<p id="connection" role="status">Kontrollerer forbindelsen…</p>
<form id="access-form">
<label>Personlig uploadnøgle<input id="access-key" type="password" autocomplete="off" spellcheck="false" placeholder="lup_…" maxlength="60" required></label>
<button type="submit" id="connect">Forbind LUP</button>
</form>
<p class="muted">Hent din nøgle én gang på <a href="https://lup.dk/extension" target="_blank" rel="noopener noreferrer">Forbind LUP-udvidelsen</a>. Adgangen er begrænset til Mathias og Kasper.</p>
<p class="muted">Nøglen gemmes kun i denne Chrome-profil. Den indgår ikke i koden eller Git.</p>
<button type="button" id="disconnect" class="secondary" hidden>Glem forbindelse på denne computer</button>
<p id="access-error" class="error" role="alert" hidden></p>
</main><script type="module" src="popup.mjs"></script></body></html>
