    <script>
        (() => {
            const themes = new Set(["system", "light", "dark", "christmas", "newyear", "hacker"]);
            let stored = null;
            try { stored = localStorage.getItem("lup-theme"); } catch { /* Tomt lager starter lyst. */ }
            const theme = themes.has(stored) ? stored : "light";
            const dark = theme === "dark" || theme === "christmas" || theme === "newyear" || theme === "hacker"
                || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.dataset.theme = theme;
            document.documentElement.dataset.bsTheme = dark ? "dark" : "light";
        })();
    </script>
