server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM host environment (undgå Development-appsettings i browser)
    add_header Blazor-Environment Production always;

    # Docker embedded DNS — resolve upstream at request time
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        set $upstream_api http://mercantec-tech-api:8080;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker must never be CDN/browser-cached — otherwise deploys leave users on stale WASM/routes.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Fingerprintede Blazor-filer må ikke omskrives. SRI og service workeren hasher de rå bytes.
    location /_framework/ {
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
        add_header Blazor-Environment Production always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
