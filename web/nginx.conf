server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM host environment (undgå Development-appsettings i browser)
    add_header Blazor-Environment Production always;

    # Docker embedded DNS — resolve upstream at request time
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Binary document persistence is internal to the API/collaboration network.
    location ^~ /api/internal/ {
        return 404;
    }

    # Only the internal observer may analyze/publish; machine credentials never enter a browser.
    location ^~ /api/platform-updates/automation/ {
        return 404;
    }

    location = /release.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /collaboration {
        set $upstream_collaboration http://mercantec-tech-collaboration:1234;
        proxy_pass $upstream_collaboration;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    location /notion-editor/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Lazy, self-hosted background-removal model and its matching WASM runtime.
    # Missing binaries must return 404 rather than the SPA shell.
    location ^~ /image-tools/ {
        types {
            application/wasm wasm;
            application/javascript js mjs;
            application/json json;
            text/css css;
            text/plain txt;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Generic prerecorded words are public static assets. Missing clips must never return the SPA shell.
    location = /audio/roulette/announcer-v1/manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /audio/roulette/cues-v1/manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location /audio/roulette/ {
        types { audio/wav wav; }
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Durable editor runs stream progress and heartbeats over SSE, including reconnects.
    location /api/ai/editor/runs {
        client_max_body_size 24m;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-store" always;
        set $upstream_api http://mercantec-tech-api:8080;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP uses Streamable HTTP. Forward every event and the original public origin.
    location = /api/mcp {
        client_max_body_size 16m;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-store" always;
        set $upstream_api http://mercantec-tech-api:8080;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/oauth-protected-resource {
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        set $upstream_api http://mercantec-tech-api:8080;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arena uses the same authenticated API service, with an explicit upgrade route.
    location = /api/arena/connect {
        set $upstream_arena http://mercantec-tech-api:8080;
        proxy_pass $upstream_arena;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    location /api/ {
        client_max_body_size 101m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        set $upstream_api http://mercantec-tech-api:8080;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker must never be CDN/browser-cached — otherwise deploys leave users on stale WASM/routes.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # The manifest must update together with the worker, never from an older CDN cache.
    location = /service-worker-assets.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /Mercantec.Tech.Web.styles.css {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /lup/lup.css {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /css/app.css {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /js/emoji-picker.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /js/lup-ui.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /js/lup-avatars.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /js/auth-storage.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /js/group-roulette-show.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /lup {
        return 301 /lup/;
    }

    location = /lup/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /lup/index.html =404;
    }

    # Fingerprintede Blazor-filer må ikke omskrives. SRI og service workeren hasher de rå bytes.
    location /_framework/ {
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
        add_header Blazor-Environment Production always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
