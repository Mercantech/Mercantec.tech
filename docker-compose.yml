services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mercantec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mercantec}
      POSTGRES_DB: ${POSTGRES_DB:-mercantec}
    volumes:
      - mercantec_tech_pg:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - mercantec-tech-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - mercantec_tech_minio:/data
    networks:
      default:
        aliases:
          - mercantec-tech-minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mercantec-tech}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://mercantec-tech-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        exit 0
    networks:
      - default
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
      ConnectionStrings__Default: ${CONNECTION_STRING:-Host=mercantec-tech-db;Port=5432;Database=mercantec;Username=mercantec;Password=mercantec}
      Cors__SpaOrigins: ${CORS_SPA_ORIGINS:-http://localhost:3000;https://mercantec.tech}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.mercantec.tech}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-mercantec-apps}
      JWKS_URI: ${JWKS_URI:-https://auth.mercantec.tech/.well-known/jwks.json}
      Lectio__BaseUrl: ${LECTIO_BASE_URL:-https://lc.mags.dk/api/}
      ObjectStorage__Endpoint: ${OBJECT_STORAGE_ENDPOINT:-http://mercantec-tech-minio:9000}
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ObjectStorage__Bucket: ${MINIO_BUCKET:-mercantec-tech}
      ObjectStorage__PublicBaseUrl: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      default:
        aliases:
          - mercantec-tech-api
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    networks:
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.mercantec-tech-web.loadbalancer.server.port=3000
    restart: unless-stopped

volumes:
  mercantec_tech_pg:
  mercantec_tech_minio:

networks:
  default:
    name: dokploy-network
    external: true
