services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mercantec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mercantec}
      POSTGRES_DB: ${POSTGRES_DB:-mercantec}
    volumes:
      - mercantec_tech_pg:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - mercantec-tech-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # quay.io/minio/{minio,mc} returnerer 401 (community-images fjernet sep. 2026).
  # pgsty/silo er AGPL-community-fork med server + mc i samme image.
  # S3 API (:9000) forbliver intern via alias mercantec-tech-minio.
  # Console (:9001) publiceres kun på minio.mercantec.tech (ikke apex).
  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Offentlig Console-URL bag Cloudflare/Traefik (lokalt overlaysættes i docker-compose.local.yml)
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-https://minio.mercantec.tech}
    volumes:
      - mercantec_tech_minio:/data
    networks:
      default:
        aliases:
          - mercantec-tech-minio
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Kun Console — S3 API eksponeres ikke via Traefik
      - traefik.http.routers.mercantec-tech-minio-console.rule=Host(`minio.mercantec.tech`)
      - traefik.http.routers.mercantec-tech-minio-console.entrypoints=web
      - traefik.http.routers.mercantec-tech-minio-console.service=mercantec-tech-minio-console
      - traefik.http.routers.mercantec-tech-minio-console.middlewares=mercantec-tech-minio-console-headers
      - traefik.http.services.mercantec-tech-minio-console.loadbalancer.server.port=9001
      - traefik.http.middlewares.mercantec-tech-minio-console-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.mercantec-tech-minio-console-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.mercantec-tech-minio-console-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.mercantec-tech-minio-console-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.mercantec-tech-minio-console-headers.headers.frameDeny=true
      - traefik.http.middlewares.mercantec-tech-minio-console-headers.headers.referrerPolicy=no-referrer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mercantec-tech}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://mercantec-tech-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        echo "minio-init: bucket $$MINIO_BUCKET klar"
        touch /tmp/minio-init-done
        # Bliv kørende — Dokploy behandler one-shot exit som fejlet deploy
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/minio-init-done"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 5s
    networks:
      - default
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
      ConnectionStrings__Default: ${CONNECTION_STRING:-Host=mercantec-tech-db;Port=5432;Database=mercantec;Username=mercantec;Password=mercantec}
      Cors__SpaOrigins: ${CORS_SPA_ORIGINS:-http://localhost:3000;https://mercantec.tech;https://lup.dk;https://www.lup.dk}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.mercantec.tech}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-mercantec-apps}
      Mcp__PublicUrl: ${LUP_MCP_PUBLIC_URL:-https://lup.dk/api/mcp}
      JWKS_URI: ${JWKS_URI:-https://auth.mercantec.tech/.well-known/jwks.json}
      ExtensionUpload__AllowedEmails: ${EXTENSION_UPLOAD_ALLOWED_EMAILS:-mags@mercantec.dk;kasc@mercantec.dk}
      ExtensionUpload__AllowedSubjects: ${EXTENSION_UPLOAD_ALLOWED_SUBJECTS:-d969fced-f7be-46d4-9bb9-5a2f03ca6974}
      Lectio__BaseUrl: ${LECTIO_BASE_URL:-https://lc.mags.dk/api/}
      ObjectStorage__Endpoint: ${OBJECT_STORAGE_ENDPOINT:-http://mercantec-tech-minio:9000}
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ObjectStorage__Bucket: ${MINIO_BUCKET:-mercantec-tech}
      ObjectStorage__PublicBaseUrl: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-}
      WebPreview__Origin: ${WEB_PREVIEW_ORIGIN:-}
      WebPreview__AppOrigin: ${WEB_PREVIEW_APP_ORIGIN:-https://mercantec.tech}
      ReverseProxy__KnownProxies: ${REVERSE_PROXY_KNOWN_PROXIES:-}
      Notion__ServiceSecret: ${NOTION_SERVICE_SECRET:-}
      Notion__ServiceSecretFile: /run/notion/service-key
      Notebook__CollaborationBaseUrl: http://mercantec-tech-collaboration:1234
      # Microsoft Graph (samme app-registration som Plan) — secrets kun via env
      Azure__TenantId: ${AZURE_TENANT_ID:-}
      Azure__ClientId: ${AZURE_CLIENT_ID:-}
      Azure__ClientSecret: ${AZURE_CLIENT_SECRET:-}
      Azure__TeacherUpnMap: ${AZURE_TEACHER_UPN_MAP:-d969fced-f7be-46d4-9bb9-5a2f03ca6974=mags@mercantec.dk;mathiasgsteenberg@gmail.com=mags@mercantec.dk;mags@mercantec.dk=mags@mercantec.dk;kasc@mercantec.dk=kasc@mercantec.dk}
      # OpenAI — nøgle kun via Dokploy/env, aldrig i git
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-6-luna}
      OpenAI__EditorModel: ${OPENAI_EDITOR_MODEL:-gpt-6.1-sol}
      OpenAI__EditorReasoningEffort: ${OPENAI_EDITOR_REASONING_EFFORT:-high}
      OpenAI__EditorResponseTokens: ${OPENAI_EDITOR_RESPONSE_TOKENS:-32768}
      OpenAI__EditorRunTokens: ${OPENAI_EDITOR_RUN_TOKENS:-131072}
      OpenAI__EditorRunMinutes: ${OPENAI_EDITOR_RUN_MINUTES:-10}
      OpenAI__EditorMaxBatches: ${OPENAI_EDITOR_MAX_BATCHES:-128}
      OpenAI__EditorWorkerConcurrency: ${OPENAI_EDITOR_WORKER_CONCURRENCY:-2}
      OpenAI__EditorRetentionDays: ${OPENAI_EDITOR_RETENTION_DAYS:-30}
      PlatformUpdatesAutomation__StoragePath: /var/lib/lup-updates
      PlatformUpdatesAutomation__ServiceKeyFile: /run/lup-updates/service-key
      PlatformUpdatesAutomation__ObserverHeartbeatPath: /var/lib/lup-updates-observer/heartbeat.json
    depends_on:
      release-news-init:
        condition: service_healthy
      notion-init:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      default:
        aliases:
          - mercantec-tech-api
    volumes:
      - mercantec_notion_key:/run/notion:ro
      - mercantec_updates_key:/run/lup-updates:ro
      - mercantec_updates_publications:/var/lib/lup-updates
      - mercantec_updates_capture:/var/lib/lup-updates-observer:ro
    restart: unless-stopped

  converter:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: preview-worker
    network_mode: none
    environment:
      PreviewWorker__SpoolPath: /spool
    volumes:
      - mercantec_preview_spool:/spool
    labels:
      - traefik.enable=false
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped

  # The observer uses the existing API-side AI configuration. It receives only its own
  # narrow service credential and sees fictional browser fixtures, never pupil accounts.
  release-news-init:
    build:
      context: .
      dockerfile: release-news/Dockerfile
    command: ["node", "init-key.mjs"]
    user: "0:0"
    network_mode: none
    volumes:
      - mercantec_updates_key:/run/lup-updates
      - mercantec_updates_capture:/data
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    labels:
      - traefik.enable=false
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');if(fs.readFileSync('/run/lup-updates/service-key','utf8').trim().length<32)process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  release-news:
    build:
      context: .
      dockerfile: release-news/Dockerfile
    init: true
    environment:
      LUP_UPDATES_API_BASE_URL: http://mercantec-tech-api:8080
      LUP_UPDATES_WEB_BASE_URL: https://lup.dk
      LUP_UPDATES_DATA_DIR: /data
      LUP_UPDATES_KEY_FILE: /run/lup-updates/service-key
      LUP_UPDATES_POLL_SECONDS: "30"
    depends_on:
      release-news-init:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - mercantec_updates_key:/run/lup-updates:ro
      - mercantec_updates_capture:/data
    networks:
      - default
    labels:
      - traefik.enable=false
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256m
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');if(Date.now()-fs.statSync('/data/heartbeat.json').mtimeMs>900000)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s
    restart: unless-stopped

  previews:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: storage-worker
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${CONNECTION_STRING:-Host=mercantec-tech-db;Port=5432;Database=mercantec;Username=mercantec;Password=mercantec}
      ObjectStorage__Endpoint: http://mercantec-tech-minio:9000
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ObjectStorage__Bucket: ${MINIO_BUCKET:-mercantec-tech}
    depends_on:
      converter:
        condition: service_started
      api:
        condition: service_started
      minio-init:
        condition: service_healthy
    volumes:
      - mercantec_preview_spool:/spool
    networks:
      - default
    labels:
      - traefik.enable=false
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped

  notion-init:
    build:
      context: ./collaboration
    command: ["node", "src/init-key.mjs"]
    user: "0:0"
    network_mode: none
    environment:
      NOTION_SERVICE_SECRET_FILE: /run/notion/service-key
    volumes:
      - mercantec_notion_key:/run/notion
    labels:
      - traefik.enable=false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');if(fs.readFileSync('/run/notion/service-key','utf8').trim().length<32)process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  collaboration:
    build:
      context: ./collaboration
    environment:
      PORT: "1234"
      API_BASE_URL: http://mercantec-tech-api:8080
      NOTION_SERVICE_SECRET: ${NOTION_SERVICE_SECRET:-}
      NOTION_SERVICE_SECRET_FILE: /run/notion/service-key
      ALLOWED_ORIGINS: ${NOTION_ALLOWED_ORIGINS:-https://mercantec.tech,https://lup.dk,https://www.lup.dk}
    depends_on:
      notion-init:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      default:
        aliases:
          - mercantec-tech-collaboration
    volumes:
      - mercantec_notion_key:/run/notion:ro
    labels:
      - traefik.enable=false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 25s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      api:
        condition: service_started
      collaboration:
        condition: service_healthy
    networks:
      default:
        aliases:
          - mercantec-tech-web
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.mercantec-tech-web.loadbalancer.server.port=3000
      # lup.dk (+ www) → samme Blazor-SPA som mercantec.tech (Dokploy domain-create eller labels)
      - traefik.http.routers.mercantec-tech-web-lup.rule=Host(`lup.dk`) || Host(`www.lup.dk`)
      - traefik.http.routers.mercantec-tech-web-lup.entrypoints=web
      - traefik.http.routers.mercantec-tech-web-lup.service=mercantec-tech-web
      - traefik.http.routers.mercantec-tech-web-lup.middlewares=mercantec-tech-web-lup-headers
      - traefik.http.middlewares.mercantec-tech-web-lup-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.mercantec-tech-web-lup-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.mercantec-tech-web-lup-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.mercantec-tech-web-lup-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.mercantec-tech-web-lup-headers.headers.frameDeny=true
      - traefik.http.middlewares.mercantec-tech-web-lup-headers.headers.referrerPolicy=no-referrer
      # Move the Games front page only. Legacy game/API paths and Arduino clients keep their existing services.
      - traefik.http.routers.mercantec-tech-games-home.rule=Host(`games.mercantec.tech`) && Path(`/`)
      - traefik.http.routers.mercantec-tech-games-home.entrypoints=web
      - traefik.http.routers.mercantec-tech-games-home.priority=10000
      - traefik.http.routers.mercantec-tech-games-home.service=mercantec-tech-web
      - traefik.http.routers.mercantec-tech-games-home.middlewares=mercantec-tech-games-home
      - traefik.http.middlewares.mercantec-tech-games-home.redirectregex.regex=^https?://games[.]mercantec[.]tech(:[0-9]+)?/
      - traefik.http.middlewares.mercantec-tech-games-home.redirectregex.replacement=https://lup.dk/games
      - traefik.http.middlewares.mercantec-tech-games-home.redirectregex.permanent=true
    restart: unless-stopped

volumes:
  mercantec_updates_key:
  mercantec_updates_publications:
  mercantec_updates_capture:
  mercantec_notion_key:
  mercantec_tech_pg:
  mercantec_tech_minio:
  mercantec_preview_spool:

networks:
  default:
    name: dokploy-network
    external: true
